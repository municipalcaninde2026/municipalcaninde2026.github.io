<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Municipal Canindé 2026</title><meta name="description" content="Tabela, classificação, artilharia, cartões, súmulas e documentos do Campeonato Municipal de Futebol de Campo 2026 de Canindé de São Francisco/SE."><meta name="theme-color" content="#0D110D"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Municipal 2026"><meta property="og:title" content="Municipal Canindé 2026"><meta property="og:description" content="Tabela, classificação, súmulas e artilharia do Campeonato Municipal de Futebol de Campo 2026."><meta property="og:image" content="icon-512.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&display=swap"><style>
/* Layout: noite de jogo no Andrezão — app de bolso: faixa de demonstração, cabeçalho com escudo, seletor de categoria fixo, conteúdo em cartões de placar, navegação inferior */
:root{
  --bg:#0D110D; --bg-2:#121812; --surface:#171E17; --surface-2:#1F281E; --line:#2D3A2C;
  --fg:#F3F1E4; --muted:#A4AE9C; --faint:#6F7A69;
  --sol:#FFC72C; --sol-deep:#E5A50A; --sol-fg:#1B1503;
  --grama:#2FA65B; --grama-2:#1C7A3E;
  --cal:#ECEADB;
  --ok:#3DBA6C; --warn:#E5B33A; --bad:#E2483D;
  --amarelo:#F7CE2D; --vermelho:#E23B33;
  --f-display:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sol)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(255,231,160,.10),transparent 60%),
   repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 70px,transparent 70px 140px),
   linear-gradient(180deg,var(--bg) 0%,#0B140D 100%)}
a{color:var(--sol)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sol);outline-offset:2px;border-radius:4px}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.cond{font-stretch:75%}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-stretch:80%;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--sol)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* faixa de demonstração */
.demo{background:repeating-linear-gradient(-45deg,var(--sol) 0 18px,var(--sol-deep) 18px 36px);color:var(--sol-fg)}
.demo .wrap{padding-block:7px;display:flex;gap:6px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;font-weight:600}
.demo b{font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;font-weight:800;background:var(--sol-fg);color:var(--sol);padding:2px 7px;border-radius:3px;margin-right:6px}
.demo a{color:var(--sol-fg);font-weight:800}

/* topo */
.top{position:relative}
.top .wrap{padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.logo{width:58px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:float 6s ease-in-out infinite}
.logo-fb{width:50px;height:58px;flex:none;display:grid;place-items:center;background:#272A26;border:3px solid var(--sol);border-radius:8px 8px 50% 50%/8px 8px 40% 40%;font-family:var(--f-display);color:var(--sol);font-size:13px;line-height:1;text-align:center}
.ttl{min-width:0;flex:1}
.ttl h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5.4vw,34px);line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.ttl h1 span{color:var(--sol)}
.ttl p{margin:3px 0 0;font-size:13px;color:var(--muted);font-stretch:85%}
.pixbtn{flex:none;display:flex;align-items:center;gap:8px;background:var(--grama);color:#fff;border:0;border-radius:999px;padding:9px 14px 9px 10px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;font-size:13px;position:relative;box-shadow:0 6px 18px rgba(47,166,91,.35)}
.pixbtn::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--grama);animation:ring 2.2s ease-out infinite;pointer-events:none}
.pixbtn svg{width:20px;height:20px}
@media (max-width:420px){.pixbtn .t2{display:none}}

/* seletor de categoria */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cats .wrap{padding-block:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:relative}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:9px;background:var(--sol);transition:transform .45s cubic-bezier(.3,1.3,.5,1);box-shadow:0 4px 14px rgba(255,199,44,.3)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:9px 4px;border-radius:9px;font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--sol-fg)}
.seg button small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.08em;opacity:.75}

/* conteúdo */
main .wrap{padding-block:18px 120px;display:grid;gap:22px}
#view{display:grid;gap:22px}
#view.in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.in>*:nth-child(2){animation-delay:.05s}#view.in>*:nth-child(3){animation-delay:.1s}#view.in>*:nth-child(4){animation-delay:.15s}#view.in>*:nth-child(5){animation-delay:.2s}#view.in>*:nth-child(n+6){animation-delay:.25s}
section{display:grid;gap:12px;min-width:0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh h2{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sh .r{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-stretch:78%;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.chip.end{background:transparent;color:var(--cal)}
.chip.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.today{background:var(--sol);color:var(--sol-fg);border-color:var(--sol)}
.chip.sim{background:#3B2A6E;color:#E3D9FF;border-color:#5B47A0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sol);color:var(--sol-fg);border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.07em;font-size:14px;text-decoration:none;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.green{background:var(--grama);color:#fff}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

/* escudos */
.cr{width:34px;height:34px;object-fit:contain;flex:none;display:block}
.cr.lg{width:76px;height:76px}
.cr.md{width:46px;height:46px}
.cr.sm{width:24px;height:24px}

/* próximo jogo */
.next{position:relative;overflow:hidden;border-radius:18px;border:1px solid color-mix(in srgb,var(--sol) 40%,var(--line));
  background:radial-gradient(90% 120% at 50% 0%,rgba(255,199,44,.14),transparent 60%),linear-gradient(180deg,#1A2318,#121812)}
.next::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(236,234,219,.08)}
.next::after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border:2px solid rgba(236,234,219,.07);border-radius:50%}
.next .in{position:relative;z-index:1;padding:16px;display:grid;gap:14px}
.next .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .t{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.vs .t b{font-family:var(--f-display);font-weight:400;font-size:clamp(17px,4.6vw,24px);text-transform:uppercase;line-height:1.02;overflow-wrap:anywhere}
.vs .t.l{animation:slideL .7s cubic-bezier(.2,.8,.2,1) both}.vs .t.r{animation:slideR .7s cubic-bezier(.2,.8,.2,1) both}
.vs .mid{display:grid;justify-items:center;gap:4px}
.vs .mid .x{font-family:var(--f-display);font-size:34px;color:var(--sol);line-height:1}
.vs .mid .hr{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.02em}
.vs .mid small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-stretch:80%;font-weight:700}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd div{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 0 6px;perspective:300px}
.cd b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--sol);font-variant-numeric:tabular-nums}
.cd b.tick{animation:flip .4s ease}
.cd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;font-stretch:80%}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;opacity:.8}

/* lista de jogos */
.day{display:grid;gap:8px}
.day h3{font-stretch:80%;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.day h3::after{content:"";flex:1;height:1px;background:var(--line)}
.mt{display:grid;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;transition:border-color .2s,transform .2s,background .2s;position:relative;overflow:hidden}
.mt:hover{border-color:color-mix(in srgb,var(--sol) 50%,var(--line));transform:translateY(-1px)}
.mt .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-stretch:85%}
.mt .mh .rd{font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.mt .mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side b{font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere;min-width:0;font-stretch:90%}
.side.win b{color:var(--fg)}.side.lose b{color:var(--muted);font-weight:600}
.sc{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sc i{font-style:normal;color:var(--faint);font-size:16px}
.sc .tm{font-family:var(--f-body);font-weight:800;font-size:15px;font-stretch:80%;background:var(--surface-2);border:1px solid var(--line);padding:5px 9px;border-radius:7px;letter-spacing:.04em}
.mt .mf{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ev{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ev span{display:inline-flex;align-items:center;gap:4px}
.ca,.cv{display:inline-block;width:9px;height:12px;border-radius:2px;flex:none}
.ca{background:var(--amarelo)}.cv{background:var(--vermelho)}
.ball{width:12px;height:12px;flex:none}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 6px;font-size:13px;font-weight:600;font-stretch:88%;color:var(--muted)}
.fbtn.only{padding-left:11px}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* tabelas */
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.cl{border-collapse:collapse;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
.cl caption{caption-side:top;text-align:left;padding:12px 12px 8px;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.cl caption small{font-family:var(--f-body);font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:8px}
.cl th,.cl td{padding:9px 6px;text-align:center;white-space:nowrap;font-size:14px}
.cl thead th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;font-stretch:80%;border-block:1px solid var(--line)}
.cl tbody tr{border-bottom:1px solid var(--line)}
.cl tbody tr:last-child{border-bottom:0}
.cl .tm{text-align:left;position:sticky;left:0;background:var(--surface);min-width:170px;box-shadow:1px 0 0 var(--line);z-index:1}
.cl .tm div{display:flex;align-items:center;gap:8px}
.cl .tm b{font-weight:700;font-stretch:90%}
.cl .pos{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:800;font-size:12px;background:var(--surface-2);flex:none}
.cl tr.q .pos{background:var(--grama);color:#fff}
.cl tr.t .pos{background:var(--warn);color:#201500}
.cl tr.x td{opacity:.55}
.cl td.pts{font-family:var(--f-display);font-size:18px;color:var(--sol)}
.cl td.sg.p{color:var(--ok)}.cl td.sg.n{color:var(--bad)}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
.form .V{background:var(--ok)}.form .E{background:#7D8576}.form .D{background:var(--bad)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}
details.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.rule summary{cursor:pointer;padding:12px 0;font-weight:700;font-stretch:90%;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.rule summary::after{content:"+";color:var(--sol);font-weight:800}
details.rule[open] summary::after{content:"–"}
details.rule ol,details.rule ul{margin:0 0 14px;padding-left:20px;color:var(--muted);display:grid;gap:4px;font-size:14px}

/* chave */
.bracket{overflow-x:auto;padding-bottom:6px}
.br{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px;min-width:680px;align-items:center}
.br.v{grid-template-columns:repeat(2,minmax(220px,1fr));min-width:480px}
.col{display:grid;gap:12px}
.col h4{margin:0;font-stretch:80%;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--sol)}
.km{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%;text-align:left;padding:0}
.km .kh{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:7px 10px;background:var(--bg-2);border-bottom:1px solid var(--line);font-stretch:85%}
.km .kr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px}
.km .kr+.kr{border-top:1px dashed var(--line)}
.km .kr b{font-weight:700;font-size:14px;overflow-wrap:anywhere;font-stretch:90%}
.km .kr.tbd b{color:var(--muted);font-weight:600;font-style:italic}
.km .kr.w b{color:var(--sol)}
.km .kr .s{font-family:var(--f-display);font-size:20px;min-width:1.4ch;text-align:right}
.km .kr .s small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-left:3px}
.champ{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(255,199,44,.22),rgba(255,199,44,.04));border:1px solid var(--sol);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.champ::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);background-size:250% 100%;animation:shine 4s linear infinite;pointer-events:none}
.champ b{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6vw,36px);text-transform:uppercase;line-height:1;display:block}
.trophy{width:58px;height:58px}

/* destaques */
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid2>*{min-width:0}
.rank{display:grid;gap:4px}
.rk{display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .p{font-family:var(--f-display);font-size:18px;color:var(--faint);text-align:center}
.rk.first .p{color:var(--sol)}
.rk .nm{min-width:0}
.rk .nm b{display:block;font-weight:700;overflow-wrap:anywhere;font-stretch:90%}
.rk .nm small{color:var(--muted);font-size:12.5px}
.rk .v{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--fg)}
.rk.first .v{color:var(--sol)}
.empty{display:grid;gap:6px;justify-items:start;padding:6px 0;color:var(--muted);font-size:14px}
.susp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.susp:last-child{border-bottom:0}
.susp .nm b{display:block;font-weight:700;font-stretch:90%}
.susp .nm small{color:var(--muted);font-size:12.5px}

/* documentos */
.docs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.doc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;transition:border-color .2s,transform .2s}
.doc:hover{border-color:var(--sol);transform:translateY(-2px)}
.doc .pg{width:52px;height:68px;border-radius:4px;background:var(--cal);position:relative;overflow:hidden;box-shadow:3px 3px 0 var(--surface-2),6px 6px 0 var(--line)}
.doc .pg img{width:100%;height:100%;object-fit:cover;object-position:top}
.doc .pg i{position:absolute;left:8px;right:8px;height:3px;background:#C9C6B4;border-radius:2px}
.doc b{display:block;font-weight:700;font-stretch:90%}
.doc small{color:var(--muted);font-size:12.5px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start}
.fact b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;color:var(--sol)}
.fact span{font-size:13.5px;color:var(--muted)}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildSim(){

      if(S.results[m.id]){out[m.id]=S.results[m.id];return}
      const h=goals(),a=goals();const r={h,a,goals:[],cards:[],sim:true};
      for(let i=0;i<h;i++)r.goals.push({t:'h',p:shirt(),tp:1+(rnd()>.5)});
      for(let i=0;i<a;i++)r.goals.push({t:'a',p:shirt(),tp:1+(rnd()>.5)});
      ['h','a'].forEach(t=>{const n=Math.floor(rnd()*4);for(let i=0;i<n;i++)r.cards.push({t,p:shirt(),c:rnd()<.08?'r':'y',tp:1+(rnd()>.5)})});
      if(ko&&h===a){const ph=3+Math.floor(rnd()*3);let pa=3+Math.floor(rnd()*3);if(pa===ph)pa=ph-1;r.pen={h:ph,a:pa}}
      out[m.id]=r;

}

  if(!k) return `<svg class="${cls}" viewBox="0 0 40 46"><path d="M20 2L37 8v14c0 11-8 18-17 22C11 40 3 33 3 22V8z" fill="none" stroke="#4A5747" stroke-width="2" stroke-dasharray="4 3"/><text x="20" y="28" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="14" fill="#6F7A69">?</text></svg>`;
  const c=CLUB[k]||{n:k,s:'?',c:'#555'}; const url=S.config.crests[c.crest||k];
  if(url) return `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" decoding="async">`;
  return `<svg class="${cls}" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2L37 8v14c0 11-8 18-17 22C11 40 3 33 3 22V8z" fill="${c.c}" stroke="rgba(255,255,255,.6)" stroke-width="1.6"/><path d="M20 2L37 8v14c0 11-8 18-17 22z" fill="rgba(0,0,0,.18)"/><text x="20" y="28.5" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="12.5" fill="#fff" letter-spacing=".6">${esc(c.s)}</text></svg>`;
}
const fmtDay = m => `${WD[m.dt.getDay()]} ${m.d}`;
const fmtHr = h => h.replace(':','h');
function status(m,r){
  const now=Date.now(),t=m.dt.getTime();
  if(r) return {k:'end',t:r.wo?'W.O.':'Encerrado'};
  if(now>=t && now<t+120*60000) return {k:'live',t:'Em andamento'};
  if(now>=t) return {k:'wait',t:'Aguardando súmula'};
  const d0=new Date();d0.setHours(0,0,0,0);
  if(t-d0.getTime()<86400000) return {k:'today',t:'Hoje'};
  return {k:'next',t:fmtDay(m)};
}
function teamLabel(m,side,comp){const s=sides(m,comp);const k=side==='a'?s.a:s.b;if(k)return {k,n:clubName(k),proj:s.proj};return {k:null,n:SLOT_LBL[side==='a'?m.sa:m.sb]||'A definir',proj:false}}
function matchCard(m,comp){
  const R=RES(),r=R[m.id],o=outcome(m,r),st=status(m,r);
  const A=teamLabel(m,'a',comp),B=teamLabel(m,'b',comp);
  const ws=o?winnerSide(m,r):null;
  const gA=(r&&r.goals||[]).filter(g=>g.t==='h').length,gB=(r&&r.goals||[]).filter(g=>g.t==='a').length;
  const ya=(r&&r.cards||[]).filter(c=>c.c==='y').length,rd=(r&&r.cards||[]).filter(c=>c.c==='r').length;
  const label = m.ko?m.fase:`${m.rod}ª rodada · Grupo ${m.grupo}`;
  return `<button class="mt" data-act="match" data-id="${m.id}">
   <div class="mh"><span class="rd">${esc(label)}</span><span>${fmtDay(m)} · ${fmtHr(m.h)}</span></div>
   <div class="mb">
    <div class="side ${ws?ws==='h'?'win':'lose':''}">${crest(A.k)}<b>${esc(A.n)}</b></div>
    <div class="sc">${o?`<span>${o.h}</span><i>×</i><span>${o.a}</span>`:`<span class="tm">${fmtHr(m.h)}</span>`}</div>
    <div class="side r ${ws?ws==='a'?'win':'lose':''}">${crest(B.k)}<b>${esc(B.n)}</b></div>
   </div>
   <div class="mf"><span class="chip ${st.k}">${esc(st.t)}</span>
    <span class="ev">${o&&o.pen&&o.pen.h!=null&&m.ko&&o.h===o.a?`<span>Pênaltis ${o.pen.h}–${o.pen.a}</span>`:''}${A.proj||B.proj?'<span>projeção</span>':''}${r&&(gA+gB)?`<span>${BALL}${gA+gB}</span>`:''}${ya?`<span><i class="ca"></i>${ya}</span>`:''}${rd?`<span><i class="cv"></i>${rd}</span>`:''}${r&&r.sumula&&r.sumula.length?`<span>${ICON.sheet.replace('<svg','<svg width="13" height="13"')} súmula</span>`:''}${r&&r.sim?'<span class="chip sim">simulado</span>':''}</span></div>
  </button>`;
}

      <div class="tw"><table class="cl"><caption>Corrida dos 3º colocados<small>os 2 melhores vão às quartas</small></caption><thead><tr><th class="tm">Equipe</th><th>Grupo</th><th>P</th><th>J</th><th>V</th><th>SG</th><th>GP</th><th>GC</th><th><i class="cv"></i></th><th><i class="ca"></i></th></tr></thead><tbody>${comp.thirds.map((x,i)=>`<tr class="${i<2?'t':''}" data-flip="t-${UI.cat}-${x.k}"><td class="tm"><div><span class="pos">${i+1}</span>${crest(x.k,'cr sm')}<b>${esc(clubName(x.k))}</b></div></td><td>${x.g}</td><td class="pts">${x.P}</td><td>${x.J}</td><td>${x.V}</td><td>${x.SG}</td><td>${x.GP}</td><td>${x.GC}</td><td>${x.CV}</td><td>${x.CA}</td></tr>`).join('')}</tbody></table></div>`;

function kmatch(m,comp){
  const k=comp.ko[m.kid];const r=RES()[m.id];const o=outcome(m,r);
  const row=(key,slot,side)=>{const tbd=!key;const w=k.win&&key===k.win;
    const sc=o?(side==='a'?o.h:o.a):'';const pn=o&&o.pen&&o.h===o.a&&o.pen.h!=null?`<small>(${side==='a'?o.pen.h:o.pen.a})</small>`:'';
    return `<div class="kr ${tbd?'tbd':''} ${w?'w':''}">${crest(key,'cr sm')}<b>${esc(key?clubName(key):SLOT_LBL[slot]||'A definir')}</b><span class="s">${sc}${pn}</span></div>`};
  return `<button class="km" data-act="match" data-id="${m.id}"><div class="kh"><span>${fmtDay(m)} · ${fmtHr(m.h)}</span><span>${k.proj?'projeção':''}</span></div>${row(k.a,m.sa,'a')}${row(k.b,m.sb,'b')}</button>`;
}
function bracket(comp){
  const C=CATS[UI.cat];const ko=C.list.filter(m=>m.ko);
  const col=(f,t)=>`<div class="col"><h4>${t}</h4>${ko.filter(m=>m.fase===f).map(m=>kmatch(m,comp)).join('')}</div>`;
  const champ=comp.champ?`<div class="champ">${TROPHY}<div><span class="eyebrow">Campeão${UI.sim?' (simulação)':''}</span><b>${esc(clubName(comp.champ))}</b><span class="muted">Vice: ${esc(clubName(comp.vice))} · Prêmio ${esc(C.premio[0])}</span></div></div>`:'';
  return `${champ}${!comp.done?'<p class="note">Enquanto a 1ª fase não termina, os confrontos mostram uma projeção: como ficaria se o campeonato acabasse hoje.</p>':''}
   <div class="bracket"><div class="br ${C.fmt==='v'?'v':''}">${C.fmt==='q'?col('Quartas','Quartas de final'):''}${col('Semifinal','Semifinais')}${col('Final','Final · 20/12')}</div></div>
   ${C.fmt==='q'?'<p class="note">Semifinal: os 4 vencedores das quartas são reordenados pela campanha da 1ª fase. 2º × 3º em 12/12 e 1º × 4º em 13/12, como na tabela oficial.</p>':''}`;
}

  const tpSel=(v,i,kind)=>`<select data-ed="${kind}" data-i="${i}" data-f="tp" aria-label="Tempo"><option value="1" ${v==1?'selected':''}>1º T</option><option value="2" ${v==2?'selected':''}>2º T</option>${m.ko?`<option value="3" ${v==3?'selected':''}>Pror.</option>`:''}</select>`;
  const gh=r.goals.filter(g=>g.t==='h').length,ga=r.goals.filter(g=>g.t==='a').length;
  const mism=!r.wo&&r.h!==''&&r.a!==''&&(gh!=+r.h||ga!=+r.a);
  const body=`${dl('h',a)}${dl('a',b)}
  <div class="scoreed"><div class="fld"><label for="ed-h">${esc(An)}</label><input id="ed-h" type="number" min="0" inputmode="numeric" value="${esc(r.h)}" data-ed="score" data-f="h"></div><span style="font-family:var(--f-display);font-size:28px;padding-bottom:10px">×</span><div class="fld"><label for="ed-a">${esc(Bn)}</label><input id="ed-a" type="number" min="0" inputmode="numeric" value="${esc(r.a)}" data-ed="score" data-f="a"></div></div>
  <div class="fgrid"><div class="fld"><label for="ed-wo">W.O.</label><select id="ed-wo" data-ed="wo"><option value="">Jogo normal</option><option value="h" ${r.wo==='h'?'selected':''}>${esc(An)} não compareceu</option><option value="a" ${r.wo==='a'?'selected':''}>${esc(Bn)} não compareceu</option></select></div>
   ${m.ko?`<div class="fld"><label for="ed-ph">Pênaltis ${esc(An)}</label><input id="ed-ph" type="number" min="0" value="${esc(r.pen&&r.pen.h!=null?r.pen.h:'')}" data-ed="pen" data-f="h"></div><div class="fld"><label for="ed-pa">Pênaltis ${esc(Bn)}</label><input id="ed-pa" type="number" min="0" value="${esc(r.pen&&r.pen.a!=null?r.pen.a:'')}" data-ed="pen" data-f="a"></div>`:''}</div>
  <section><div class="sh"><span class="lbl">Gols (${r.goals.length})</span><button class="btn sm ghost" data-act="ed-add" data-k="goals">+ Gol</button></div>
   <div class="ed-list">${r.goals.map((g,i)=>`<div class="erow">${sideSel(g.t,i,'goals')}<input class="inp p" list="dl-${g.t}" placeholder="Nº e nome (ex.: #9 João)" value="${esc(g.p)}" data-ed="goals" data-i="${i}" data-f="p" aria-label="Autor do gol">${tpSel(g.tp,i,'goals')}<button class="x" data-act="ed-del" data-k="goals" data-i="${i}" aria-label="Remover gol">${ICON.x}</button></div>`).join('')||'<p class="note">Sem gols.</p>'}</div>
   ${mism?`<p class="warn">Os gols listados (${gh} × ${ga}) não batem com o placar. Confira antes de publicar.</p>`:''}</section>
  <section><div class="sh"><span class="lbl">Cartões (${r.cards.length})</span><button class="btn sm ghost" data-act="ed-add" data-k="cards">+ Cartão</button></div>
   <div class="ed-list">${r.cards.map((c,i)=>`<div class="erow c">${sideSel(c.t,i,'cards')}<input class="inp p" list="dl-${c.t}" placeholder="Nº e nome" value="${esc(c.p)}" data-ed="cards" data-i="${i}" data-f="p" aria-label="Jogador"><select data-ed="cards" data-i="${i}" data-f="c" aria-label="Cartão"><option value="y" ${c.c==='y'?'selected':''}>Amarelo</option><option value="r" ${c.c==='r'?'selected':''}>Vermelho</option></select>${tpSel(c.tp,i,'cards')}<button class="x" data-act="ed-del" data-k="cards" data-i="${i}" aria-label="Remover cartão">${ICON.x}</button></div>`).join('')||'<p class="note">Sem cartões.</p>'}</div></section>
  <section><div class="sh"><span class="lbl">Súmula (${r.sumula.length} foto${r.sumula.length===1?'':'s'})</span><label class="btn sm ghost" for="ed-up">+ Fotos da súmula</label></div><input id="ed-up" type="file" accept="image/*" multiple class="sr" data-ed="upload">
   ${r.sumula.length?`<div class="sumu">${r.sumula.map((u,i)=>`<div style="position:relative"><button type="button" style="width:100%" aria-label="Página ${i+1}"><img src="${esc(u)}" alt=""></button><button class="x" style="position:absolute;top:6px;right:6px" data-act="ed-del" data-k="sumula" data-i="${i}" aria-label="Remover foto">${ICON.x}</button></div>`).join('')}</div>`:'<p class="note">Fotografe a súmula inteira, de cima, com boa luz.</p>'}</section>
  <div class="fld"><label for="ed-obs">Observação pública (opcional)</label><textarea id="ed-obs" rows="2" data-ed="obs" placeholder="Ex.: jogo começou às 19h16">${esc(r.obs||'')}</textarea></div>
  <div class="row"><button class="btn" data-act="ed-save">Salvar e publicar</button>${S.results[id]?'<button class="btn danger" data-act="ed-clear">Apagar resultado</button>':''}<button class="btn ghost" data-act="close">Cancelar</button></div>
  <p class="note">Ao salvar, o app baixa o <b>dados.json</b>. Suba no GitHub substituindo o antigo e, se anexou fotos, coloque-as na pasta <b>sumulas</b>.</p>`;
  const ov=$('#ov');
  if(ov&&ov.dataset.edit===id){ov.querySelector('.sh-b').innerHTML=body}
  else{const o=openSheet(`Lançar · ${CATS[m.cat].nome} · ${m.ko?m.fase:m.rod+'ª rodada'}`,body);o.dataset.edit=id}
}
function edInput(el){
  const r=DRAFT.r;const k=el.dataset.ed;
  if(k==='score'){r[el.dataset.f]=el.value===''?'':+el.value}
  else if(k==='wo'){r.wo=el.value||undefined;if(!r.wo)delete r.wo}
  else if(k==='pen'){r.pen=r.pen||{};r.pen[el.dataset.f]=el.value===''?null:+el.value}
  else if(k==='obs'){r.obs=el.value}
  else if(k==='goals'||k==='cards'){const it=r[k][+el.dataset.i];const f=el.dataset.f;it[f]=f==='tp'?+el.value:el.value;if(f==='t'){drawEdit();return}}
}
async function edUpload(files){
  const id=DRAFT.id;let n=DRAFT.r.sumula.length;
  for(const f of files){n++;const blob=await shrink(f);const name=`${id}-${n}.jpg`;saveFile(blob,name);DRAFT.r.sumula.push('sumulas/'+name);await new Promise(r=>setTimeout(r,400))}
  drawEdit();toast('Fotos baixadas. Coloque-as na pasta sumulas do GitHub.');
}
function shrink(file){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.8)};img.onerror=()=>res(file);img.src=u})}
async function edSave(){
  const {id,r}=DRAFT;
  if(!r.wo&&(r.h===''||r.a==='')){toast('Preencha o placar dos dois times');return}
  if(r.wo){r.h=r.wo==='a'?3:0;r.a=r.wo==='h'?3:0}
  r.goals=r.goals.filter(g=>g.p||true);r.cards=r.cards.filter(c=>c.p);
  if(r.pen&&(r.pen.h==null||r.pen.a==null))delete r.pen;
  r.at=new Date().toISOString();
  const prev=S.results[id];S.results[id]=r;
  const ok=await publish();
  if(!ok){if(prev)S.results[id]=prev;else delete S.results[id];return}
  closeSheet();render(false,true);
}
async function edClear(){const id=DRAFT.id;const prev=S.results[id];delete S.results[id];const ok=await publish();if(!ok){S.results[id]=prev;return}closeSheet();render(false,true)}
function adminSheet(){
  const C=CATS[UI.cat];const comp=compute(UI.cat,S.results);const p=S.config.pix;
  const pend=C.list.filter(m=>{const s=sides(m,comp);return !S.results[m.id]&&m.dt.getTime()<Date.now()&&s.a&&s.b});
  const body=`<p class="note" style="color:var(--fg)">Modo organizador neste aparelho. Lance o jogo, toque em Salvar e o app baixa o arquivo <b>dados.json</b> (e as fotos da súmula). Suba esses arquivos no repositório do GitHub, substituindo os antigos; em 1 a 2 minutos todo mundo vê.</p><div class="row"><button class="btn sm ghost" data-act="org-off">Sair do modo organizador</button></div><p class="note" hidden></p>
  <section><div class="sh"><span class="lbl">Aguardando súmula · ${esc(C.nome)}</span></div>${pend.length?pend.map(m=>matchCard(m,comp).replace('data-act="match"','data-act="edit"')).join(''):'<p class="note">Nenhum jogo atrasado nesta categoria.</p>'}</section>
  <section><div class="sh"><span class="lbl">Todos os jogos · ${esc(C.nome)}</span></div><div class="fld"><label for="ad-m">Escolha o jogo</label><select id="ad-m">${C.list.map(m=>{const s=sides(m,comp);const ok=!m.ko||(s.a&&s.b&&!s.proj);return `<option value="${m.id}" ${ok?'':'disabled'}>${m.d} · ${m.ko?m.fase:m.rod+'ª'} · ${esc(s.a?clubName(s.a):SLOT_LBL[m.sa])} × ${esc(s.b?clubName(s.b):SLOT_LBL[m.sb])}${S.results[m.id]?' ✓':''}</option>`}).join('')}</select></div><div class="row"><button class="btn sm" data-act="ad-open">Abrir jogo</button></div></section>
  <section><div class="sh"><span class="lbl">Pix de apoio ao app</span></div>
   <div class="fgrid"><div class="fld"><label for="cf-k">Chave Pix</label><input id="cf-k" value="${esc(p.chave)}" placeholder="CNPJ, e-mail, telefone ou aleatória"></div><div class="fld"><label for="cf-n">Nome do favorecido</label><input id="cf-n" value="${esc(p.nome)}" maxlength="25"></div><div class="fld"><label for="cf-c">Cidade</label><input id="cf-c" value="${esc(p.cidade)}" maxlength="15"></div><div class="fld"><label for="cf-w">WhatsApp do HUB (opcional)</label><input id="cf-w" value="${esc(S.config.whats)}" placeholder="(79) 9 0000-0000"></div></div>
   <div class="row"><button class="btn sm" data-act="cf-save">Salvar e publicar</button></div></section>
  <section><div class="sh"><span class="lbl">Escudos e logomarca</span></div>
   <div class="fgrid"><div class="fld"><label for="cf-team">Time</label><select id="cf-team">${Object.keys(CLUB).filter(k=>!CLUB[k].crest).map(k=>`<option value="${k}">${esc(CLUB[k].n)}${S.config.crests[k]?' ✓':''}</option>`).join('')}<option value="__hub">Logomarca do HUB</option></select></div><div class="fld"><label for="cf-img">Imagem (PNG de preferência)</label><input id="cf-img" type="file" accept="image/*"></div></div>
   <div class="row"><button class="btn sm" data-act="cf-img">Enviar e publicar</button></div></section>`;
  openSheet('Painel do organizador',body);
}
async function cfSave(){
  const prev=JSON.stringify(S.config);
  S.config.pix={chave:$('#cf-k').value.trim(),nome:$('#cf-n').value.trim()||'HUB SERTAO CONECTA',cidade:$('#cf-c').value.trim()||'CANINDE'};S.config.whats=$('#cf-w').value.trim();
  if(!(await publish())){S.config=JSON.parse(prev);return}
  closeSheet();boot();
}
async function cfImg(){
  const f=$('#cf-img').files[0];const k=$('#cf-team').value;if(!f){toast('Escolha uma imagem');return}
  const name=k==='__hub'?'hub-logo.png':k+'.png';saveFile(f,name);
  if(k==='__hub')S.config.hubLogo='hub-logo.png';else S.config.crests[k]='escudos/'+name;
  await publish();toast(k==='__hub'?'Suba hub-logo.png e dados.json no GitHub':'Suba '+name+' na pasta escudos e o dados.json');closeSheet();boot();
}
/* ---- auto-publicação: a página é o registro ---- */
const RESET='<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>';
function buildDoc(){
  const keep=$$('[data-keep]');S.updatedAt=new Date().toISOString();
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  const parts=[];let stateDone=false;
  keep.forEach(el=>{
    if(el.id==='app'&&!stateDone){parts.push('<div id="root"></div>','<script id="state" type="application/json">'+json+'<\/script>');stateDone=true}
    if(el.tagName==='SCRIPT'){parts.push(el.outerHTML)}else parts.push(el.outerHTML);
  });
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">'+RESET+'</head><body>'+parts.join('\n')+'</body></html>';
}
async function publish(){
  S.updatedAt=new Date().toISOString();
  LS.set('draft',S);
  saveFile(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'dados.json');
  toast('Baixado o dados.json. Suba no GitHub para todos verem.');
  return true;
}
/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='tab'){UI.tab=t.dataset.tab;closeSheet();try{history.replaceState(null,'','#'+UI.tab)}catch(_){}render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'})}
  else if(a==='cat'){UI.cat=t.dataset.k;UI.team='';LS.set('cat',UI.cat);render()}
  else if(a==='team'){UI.team=t.dataset.k;render(false)}
  else if(a==='tview'){UI.tview=t.dataset.k;render(false)}
  else if(a==='sim'){UI.sim=!UI.sim;if(UI.sim&&!SIM)SIM=buildSim();render(false,true);toast(UI.sim?'Simulação ligada: placares fictícios':'De volta aos dados reais')}
  else if(a==='match'){matchSheet(t.dataset.id)}
  else if(a==='close'){closeSheet()}
  else if(a==='pix'){pixSheet()}
  else if(a==='copy'){copy(t.dataset.text)}
  else if(a==='doc'){docSheet(t.dataset.k)}
  else if(a==='dl'){downloadDoc(t.dataset.k)}
  else if(a==='sumula'){const r=RES()[t.dataset.id];imgViewer('Súmula',r.sumula)}
  else if(a==='admin'){adminSheet()}
  else if(a==='ad-open'){editSheet($('#ad-m').value)}
  else if(a==='edit'){editSheet(t.dataset.id)}
  else if(a==='ed-add'){const k=t.dataset.k;DRAFT.r[k].push(k==='goals'?{t:'h',p:'',tp:1}:{t:'h',p:'',c:'y',tp:1});drawEdit()}
  else if(a==='ed-del'){DRAFT.r[t.dataset.k].splice(+t.dataset.i,1);drawEdit()}
  else if(a==='ed-save'){edSave()}
  else if(a==='ed-clear'){if(t.dataset.sure){edClear()}else{t.dataset.sure='1';t.textContent='Toque de novo para apagar'}}
  else if(a==='cf-save'){cfSave()}
  else if(a==='cf-img'){cfImg()}
  else if(a==='org-off'){LS.set('org',0);UI.canEdit=false;closeSheet();boot()}
  else if(a==='install'){if(DEFER){DEFER.prompt();DEFER.userChoice.finally(()=>{DEFER=null;hideInstall()})}}
  else if(a==='inst-x'){LS.set('noinst',1);hideInstall()}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-ed]');if(el&&DRAFT&&el.dataset.ed!=='upload')edInput(el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ed]');if(!el||!DRAFT)return;if(el.dataset.ed==='upload'){edUpload([...el.files]);el.value=''}else if(el.tagName==='SELECT')edInput(el);if(el.dataset.ed==='score')drawEdit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==UI.tab){UI.tab=h;render()}});

if(location.hash==='#organizador'){LS.set('org',1)}
if(LS.get('org',0)){UI.canEdit=true;if(location.hash==='#organizador')UI.tab='inicio'}
boot();
(async()=>{
  try{const r=await fetch('dados.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();
    let use=d;const dr=UI.canEdit&&LS.get('draft',null);if(dr&&dr.updatedAt&&(!d.updatedAt||dr.updatedAt>d.updatedAt))use=dr;
    S.results=use.results||{};S.config=Object.assign({},S.config,use.config||{});S.updatedAt=use.updatedAt;SIM=null;boot();
  }catch(e){}
})();
let DEFER=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function hideInstall(){const b=$('.inst');b&&b.remove()}
function showInstall(ios){if(standalone()||LS.get('noinst',0)||$('.inst'))return;const b=document.createElement('div');b.className='inst';b.setAttribute('role','region');b.setAttribute('aria-label','Instalar aplicativo');
  b.innerHTML=ios?'<p><b>Instale o app do Municipal</b>Toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p><button class="x" data-act="inst-x" aria-label="Fechar">'+ICON.x+'</button>':'<p><b>Instale o app do Municipal</b>Fica na tela inicial, sem loja e sem ocupar espaço.</p><button class="btn sm" data-act="install">Instalar</button><button class="x" data-act="inst-x" aria-label="Fechar">'+ICON.x+'</button>';document.body.appendChild(b)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;showInstall(false)});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone())setTimeout(()=>showInstall(true),2500);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
